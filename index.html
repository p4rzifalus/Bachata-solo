<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бачата соло</title>
<style>
  :root{
    --graphite:#171A1C; --slate:#232A2D; --chalk:#F0EDE8;
    --dim:#8A9296; --teal:#79B3A5; --amber:#E8B23A;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--graphite);color:var(--chalk);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}

  .screen{position:fixed;inset:0;display:none}
  body[data-screen="start"]  #start,
  body[data-screen="camera"] #stage,
  body[data-screen="metro"]  #metro{display:flex}
  .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}

  /* метроном */
  #metro{flex-direction:column}
  #beatBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
  #countLabel{color:var(--dim);font-size:1rem;letter-spacing:.08em;text-transform:uppercase;min-height:1.2em}
  #count{font-weight:200;font-size:min(46vh,62vw);line-height:.8;font-variant-numeric:tabular-nums;
    color:var(--chalk);transition:color .08s}
  #count.one{color:var(--teal);font-weight:500}
  #count.countin{color:var(--dim)}
  #count.pop{animation:pop .16s ease-out}
  @keyframes pop{from{transform:scale(1.08)}to{transform:scale(1)}}
  #dots{display:flex;gap:.55rem}
  #dots i{width:10px;height:10px;border-radius:50%;background:rgba(240,237,232,.18)}
  #dots i.on{background:var(--chalk)}
  #dots i.on:first-child{background:var(--teal)}
  #metroPanel{width:100%;max-width:32rem;margin:0 auto;
    padding:1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom))}
  #metroPanel label.row{justify-content:space-between;color:var(--dim);margin-bottom:.4rem}
  #metroPanel label b{color:var(--chalk);font-weight:500;font-variant-numeric:tabular-nums}
  #bpm{width:100%;accent-color:var(--teal);margin:0 0 1rem}
  #bpm:disabled{opacity:.4}
  #latency{font:12px/1.3 ui-monospace,Menlo,monospace;color:var(--dim);margin-bottom:.9rem;display:none}
  body.debug #latency{display:block}
  #metroPanel .row{justify-content:space-between}
  @media (prefers-reduced-motion:reduce){#count.pop{animation:none}}

  /* старт и заглушка следующего этапа */
  .card{flex-direction:column;justify-content:center;align-items:flex-start;
    max-width:32rem;margin:0 auto;padding:1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom))}
  .card h1{font-size:1.6rem;font-weight:600;margin:0 0 1rem}
  .card p{line-height:1.55;color:var(--dim);margin:0 0 1rem}
  .card p b{color:var(--chalk);font-weight:500}
  #startError{color:var(--amber)}

  /* камера */
  #stage{background:#000}
  video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  video{filter:brightness(.55) saturate(.6)}
  body.mirrored video, body.mirrored #overlay{transform:scaleX(-1)}

  #hud{position:absolute;left:0;right:0;top:0;padding:calc(1rem + env(safe-area-inset-top)) 1rem 0;
    display:flex;flex-direction:column;align-items:center;pointer-events:none}
  #hint{max-width:28ch;text-align:center;font-size:1.1rem;line-height:1.45;
    padding:.6rem .9rem;border-radius:12px;background:rgba(23,26,28,.72)}
  #hint b{font-weight:600}
  #hint.good b{color:var(--teal)}
  #hint.warn b{color:var(--amber)}
  #hold{width:min(240px,60vw);height:4px;margin-top:.9rem;background:rgba(240,237,232,.2);
    border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s}
  #hold.on{opacity:1}
  #holdFill{height:100%;width:0%;background:var(--teal)}

  #fps{position:absolute;left:.75rem;bottom:calc(5.2rem + env(safe-area-inset-bottom));
    font:12px/1.3 ui-monospace,Menlo,monospace;color:var(--dim);
    background:rgba(23,26,28,.72);padding:.25rem .45rem;border-radius:6px;display:none}
  body.debug #fps{display:block}

  #controls{position:absolute;left:0;right:0;bottom:0;
    padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    display:flex;gap:.6rem;align-items:center;
    background:linear-gradient(to top,rgba(23,26,28,.92),rgba(23,26,28,0))}
  #controls .spacer{flex:1}

  button{font:inherit;font-weight:500;color:var(--chalk);background:var(--slate);
    border:1px solid rgba(240,237,232,.18);border-radius:10px;padding:.75rem 1.15rem;cursor:pointer}
  button:hover{background:#2c3538}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  button[disabled]{opacity:.4;cursor:default}
  button.primary{background:var(--teal);color:#10201C;border-color:transparent}
  button.primary:hover{background:#8ac2b4}
  button.primary[disabled]{background:var(--slate);color:var(--chalk)}
</style>
</head>
<body data-screen="start" class="mirrored">

<section id="start" class="screen card">
  <h1>Бачата соло</h1>
  <p>Тренажёр базового шага. Камера смотрит, как ты шагаешь, и сравнивает шаги с битом музыки.</p>
  <p><b>Видео не покидает телефон</b> — всё считается прямо в браузере.</p>
  <p>Поставь телефон вертикально, отойди на пару метров, чтобы в кадре было всё тело — от макушки до ступней.</p>
  <p id="startError"></p>
  <div class="row">
    <button id="startBtn" class="primary">Включить камеру</button>
    <button id="metroOnlyBtn">Только метроном</button>
  </div>
</section>

<section id="stage" class="screen">
  <video id="cam" playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div id="hint"></div>
    <div id="hold"><div id="holdFill"></div></div>
  </div>

  <div id="fps">—</div>

  <div id="controls">
    <button id="flipBtn">Сменить камеру</button>
    <span class="spacer"></span>
    <button id="nextBtn" class="primary" disabled>Дальше</button>
  </div>
</section>

<section id="metro" class="screen">
  <div id="beatBox">
    <div id="countLabel">&nbsp;</div>
    <div id="count">·</div>
    <div id="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div id="metroPanel">
    <label for="bpm" class="row"><span>Темп</span><span><b id="bpmVal">128</b> BPM</span></label>
    <input id="bpm" type="range" min="110" max="150" step="1" value="128">
    <div id="latency">—</div>
    <div class="row">
      <button id="backBtn">Назад</button>
      <button id="playBtn" class="primary">Старт</button>
    </div>
  </div>
</section>

<script type="module" src="./src/app.js"></script>
</body>
</html>
